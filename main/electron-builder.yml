publish:
  - "github"
productName: "Exiled Exchange 2"
npmRebuild: false
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
  - from: "node_modules/catboost"
    to: "node_modules/catboost"
    filter:
      - "lib/**/*"
      - "build/Release/catboost-node.node"
      - "build/Release/catboostmodel.dll"
      - "package.json"
  - from: "../renderer/public/data/gradientBoostModel"
    to: "data/gradientBoostModel"
extraMetadata:
  main: "main.js"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
win:
  target:
    - "nsis"
    - "portable"
linux:
  target:
    - "AppImage"
mac:
  target:
    - target: "dmg"
      arch:
        - "universal"
  identity: null
  x64ArchFiles: "*"
appImage:
  executableArgs:
    - "--sandbox"
